description: 'Edme Insurance Brokers Ltd (formerly Aditya Birla Insurance Brokers, ABIBL) is an
  India-based composite insurance broker offering corporate, retail, and reinsurance solutions across
  30+ industries including aviation, marine, energy, manufacturing, pharmaceuticals, technology, and the
  BFSI and FMCG sectors. The company provides tailored risk management, employee benefits, and claims
  advisory services, backed by digital customer portals for policy and claims management and employee
  benefits. Edme is a portfolio company of Norwest Venture Partners. This is a company profile in the
  API Evangelist network; Edme publishes no public developer program or API surface at this time.'
